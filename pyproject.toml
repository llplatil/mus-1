[project]
name = "mus1"
dynamic = ["version"]
description = "MUS1 web-based experiment browser and analysis tool"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=1.9.0",
  "pandas>=1.5.0",
  "numpy>=1.21.0,<=1.26.4",
  "PyYAML>=6.0",
  "openpyxl>=3.1.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "SQLAlchemy>=1.4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
  "streamlit",
  "pillow",
  "opencv-python-headless",
  "matplotlib>=3.5.0",
  "shapely>=2.0.7",
  # streamlit-drawable-canvas is archived and breaks on Streamlit>=1.41.
  # Use a maintained drop-in fix.
  "streamlit-drawable-canvas-fix>=0.9.8",
]
api = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pillow",
  "opencv-python-headless",
]

[project.scripts]
mus1 = "mus1.core.simple_cli:app"

[project.entry-points."mus1.plugins"]
project_importer = "mus1.plugins.project_importer:ProjectImporterPlugin"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mus1*"]

[tool.setuptools.dynamic]
version = {attr = "mus1.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["workspace", "projects", "logs", "_workspace_noisy_archive", ".git"]
